<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Воздушное путешествие</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;color:#fff4d8}*{box-sizing:border-box}body{margin:0;background:#0c1e2a;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid #fff1af;outline-offset:5px}button:disabled{cursor:default}#viewport{width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden}#frame{position:relative}#game{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;background:#193d51 url('fon.png') center/cover no-repeat}#game:before{content:'';position:absolute;inset:0;background:linear-gradient(#0a203944,transparent 45%,#091f2733);pointer-events:none}.screen{position:absolute;inset:0} [hidden]{display:none!important} .eyebrow{text-transform:uppercase;letter-spacing:6px;color:#ddc985;font-size:20px}h1,h2,p{margin:0}h1{font:normal 66px Georgia,serif;letter-spacing:1px;margin:8px 0 10px}h2{font:normal 58px Georgia,serif}.sub{font-size:25px;color:#bfd7d8;line-height:1.5}.panel{border:1px solid #9cbba84d;background:linear-gradient(145deg,#143644f2,#102a37f5);box-shadow:0 28px 90px #03152166;border-radius:42px}.menu-card{position:absolute;inset:40px 235px;padding:30px 56px;text-align:center}.settings{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;text-align:left;margin:22px 0 20px}.group{padding:20px;background:#6d9a9b0d;border:1px solid #a6c5be22;border-radius:24px}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.group h3{font-size:28px;font-weight:500;margin:0}.limit{font-size:19px;color:#b4c7c7}.letters{display:flex;flex-wrap:wrap;gap:12px}.letter{width:74px;height:69px;border-radius:16px;border:1px solid #92b5ae66;background:#274a56;color:#f9f3dc;font-size:32px;font-weight:600;transition:background .15s,transform .15s}.letter:hover{background:#365e67;transform:translateY(-2px)}.letter[aria-pressed=true]{background:linear-gradient(145deg,#fae1a0,#d9b964);color:#263f42;borde :50%;outline-width:3px}.wing-left{transform-origin:502px 568px;animation:wing-left 1.5s ease-in-out infinite}.wing-right{transform-origin:727px 584px;animation:wing-right 1.5s ease-in-out infinite}@keyframes wing-left{0%,100%{transform:rotate(-2deg) scaleX(1)}50%{transform:rotate(3deg) scaleX(.86)}}@keyframes wing-right{0%,100%{transform:rotate(2deg) scaleX(1)}50%{transform:rotate(-3deg) scaleX(.86)}}.bug text{font:bold 177px Arial,sans-serif;fill:#3b3225;letter-spacing:3px}.bug.catching{filter:drop-shadow(0 0 35px #ffe0a5) brightness(1.15)}.jar-area{position:absolute;left:807px;top:763px;width:306px;height:306px;pointer-events:none}.jar-glow{position:absolute;inset:36px 22px 8px;border-radius:50%;background:radial-gradient(ellipse,#ffe394aa,transparent 66%);opacity:0;transition:opacity .6s,transform 1.4s;filter:blur(12px)}.jar{position:absolute;width:100%;height:100%;z-index:3}.lid{position:absolute;width:190px;left:57px;top:-43px;z-index:4;transform:rotate(-8deg);transition:transform 1.4s ease,top 1.4s ease,opacity 1.4s}.jar-area.closed .lid{top:18px;transform:rotate(0deg)}.jar-area.releasing .lid{top:-135px;transform:rotate(22deg);opacity:0}.jar-area.releasing .jar-glow{transform:scale(1.9)}.jar-lights{position:absolute;inset:0;z-index:2}.light{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff6bd;box-shadow:0 0 14px 5px #ffd65b99;animation:twinkle 2s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.4;transform:translateY(-5px)}}.particle{position:absolute;width:9px;height:9px;background:#ffe5a0;border-radius:50%;pointer-events:none;box-shadow:0 0 13px #ffd85f;animation:spark .8s ease-out forwards;z-index:10}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}#ending{z-index:20;background:#061c2a66;display:grid;place-items:center;backdrop-filter:blur(5px)}.end-card{width:850px;padding:58px 50px;text-align:center}.end-card .eyebrow{margin-bottom:18px}.end-card .sub{margin:24px 0 35px}.end-actions{display:flex;justify-content:center;gap:18px}.end-actions .primary{padding:20px 35px}.end-actions .ghost{padding:20px 28px}#asset-error{position:absolute;bottom:12px;left:20%;right:20%;text-align:center;color:#ffdeba;background:#263b43;padding:10px;border-radius:12px;font-size:19px;z-index:30}@media(prefers-reduced-motion:reduce){.wing-left,.wing-right,.light{animation:none}.particle{animation-duration:.01s}}

on-button svg{position:absolute;inset:0;width:250px;height:340px;pointer-events:none}.balloon-button span{position:absolute;left:0;top:0;width:250px;height:235px;display:grid;place-items:center;color:#29354b;font:bold 63px Arial,sans-serif;letter-spacing:1px;pointer-events:none}.balloon-button:focus-visible{outline:4px solid #fff4ba;border-radius:48%}.balloon-button:disabled{cursor:default}.end-card{background:linear-gradient(145deg,#fff9ecf9,#e7f1f9f9);color:#344f68;border-color:white;width:1000px}.end-card h2{font-size:62px}.end-card .sub{font-size:32px;color:#57768b}#ending{background:#d9eff64d;backdrop-filter:blur(4px)}

</style></head><body><div id="viewport"><div id="frame"><main id="game"><div id="street" aria-hidden="true"></div><section id="menu" class="screen" aria-label="Настройка слогов"><div class="menu-card panel"><div class="eyebrow">Большое приключение начинается здесь</div><h1>Воздушное путешествие</h1><p class="sub">Выбери слоги и помоги дому отправиться в путешествие</p><div class="settings"><section class="group"><div class="group-head"><h3>Согласные</h3><span class="limit" id="consonant-count"></span></div><div class="letters" id="consonants" aria-label="Выбери до четырёх согласных"></div></section><section class="group"><div class="group-head"><h3>Гласные</h3><span class="limit" id="vowel-count"></span></div><div class="letters" id="vowels" aria-label="Выбери до четырёх гласных"></div></section></div><div class="type-picker" role="group" aria-label="Тип слогов"><span class="type-label">Тип слогов</span><button class="type-button" data-type="open" aria-pressed="true">Открытые<small>МА · СУ</small></button><button class="type-button" data-type="closed" aria-pressed="false">Закрытые<small>АМ · УС</small></button><button class="type-button" data-type="mixed" aria-pressed="false">Смешанные<small>МА · АМ</small></button></div><p class="preview-label" id="preview-label"></p><div class="syllables" id="syllables"></div><p class="message" id="message" role="status" aria-live="polite"></p><button id="play" class="primary">Играть</button></div></section>
<section id="playfield" class="screen" hidden aria-label="Дом и воздушные шарики">
<svg class="scene" viewBox="0 0 1920 1080" aria-hidden="true">
 <ellipse id="house-shadow" cx="960" cy="843" rx="216" ry="19" fill="#354831" opacity=".21"/>
 <g id="distant-clouds" opacity="0"><image href="cloud.png" x="-100" y="-420" width="540" height="270"/><image href="cloud.png" x="1290" y="-690" width="630" height="315"/></g>
</svg>
<div id="house-layer" class="scene"><svg class="scene" viewBox="0 0 1920 1080" aria-hidden="true"><g id="flying-house"><g id="tethers"></g><g id="attached-balloons"></g><image href="house.png" x="705" y="345" width="510" height="510"/></g>
</svg></div>
<svg class="scene" viewBox="0 0 1920 1080" aria-hidden="true"><g id="clouds" opacity="0"><image href="cloud.png" x="-220" y="-220" width="480" height="240"/><image href="cloud.png" x="1550" y="-380" width="490" height="245"/></g>
</svg>
<div id="incoming"></div><div class="game-nav"><button id="back" class="ghost">Изменить слоги</button></div>

</section>
<section id="ending" class="screen" hidden aria-label="Путешествие началось"><div class="panel end-card"><div class="eyebrow">Все готовы к полёту</div><h2>Путешествие началось!</h2><p class="sub">Спасибо за помощь!</p><div class="end-actions"><button id="again" class="primary">Играть ещё</button><button id="change" class="ghost">Изменить слоги</button></div></div></section>
<p id="asset-error" hidden role="alert"></p></main></div></div><script>
'use strict';
const $=id=>document.getElementById(id);
const C=['М','Н','П','Б','Т','Д','К','Г','Ф','В','С','З','Л','Р','Х'];
const V=['А','О','У','Ы','И','Э','Я','Е','Ё','Ю'];
const colors=['pink','blue','yellow','mint','lavender'];
const selectedC=new Set(['М','Н','С','Л']),selectedV=new Set(['А','О','У','И']);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let syllableType='open',mode='menu',queue=[],total=0,caught=0,clock=0,lastTime=0,raf=0;
let balloon=null,houseY=0,finalStart=0,pose={x:0,y:0,angle:0},lastPose='';
function renderHouse(){const value=`translate3d(${pose.x.toFixed(2)}px,${pose.y.toFixed(2)}px,0) rotate(${pose.angle.toFixed(3)}deg)`;if(value!==lastPose){$('house-layer').style.transform=value;lastPose=value;}}
const NS='http://www.w3.org/2000/svg';
function svg(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;}
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('frame').style.width=1920*scale+'px';$('frame').style.height=1080*scale+'px';$('game').style.transform=`scale(${scale})`;}
addEventListener('resize',fit);fit();
function makeSyllables(cs,vs,type){return cs.flatMap(c=>vs.flatMap(v=>type==='mixed'?[c+v,v+c]:[type==='closed'?v+c:c+v]));}
function pairs(){return makeSyllables(C.filter(c=>selectedC.has(c)),V.filter(v=>selectedV.has(v)),syllableType);}
function refresh(message=''){
 for(const [id,set] of [['consonants',selectedC],['vowels',selectedV]])for(const b of $(id).children)b.setAttribute('aria-pressed',set.has(b.textContent));
 for(const b of document.querySelectorAll('[data-type]'))b.setAttribute('aria-pressed',b.dataset.type===syllableType);
 $('consonant-count').textContent=selectedC.size+' из 4';$('vowel-count').textContent=selectedV.size+' из 4';
 const p=pairs();$('preview-label').textContent=p.length?`Слоги этого раунда · ${p.length}`:'Выбери хотя бы одну согласную и одну гласную';
 $('syllables').replaceChildren(...p.map(s=>{const e=document.createElement('span');e.className='chip';e.textContent=s;return e;}));
 $('play').disabled=!p.length;$('message').textContent=message;
}
for(const [id,list,set] of [['consonants',C,selectedC],['vowels',V,selectedV]])for(const letter of list){const b=document.createElement('button');b.className='letter';b.textContent=letter;b.onclick=()=>{if(set.has(letter))set.delete(letter);else if(set.size<4)set.add(letter);else return refresh('Можно выбрать до 4 букв. Сними выделение с одной, чтобы выбрать другую.');refresh();};$(id).append(b);}
for(const b of document.querySelectorAll('[data-type]'))b.onclick=()=>{syllableType=b.dataset.type;refresh();};refresh();
function shuffle(list){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}return list;}
function clean(){cancelAnimationFrame(raf);balloon=null;$('incoming').replaceChildren();$('tethers').replaceChildren();$('attached-balloons').replaceChildren();}
function addAttached(x,y,color,size=104){
 const knotY=y+size*.976;
 $('tethers').append(svg('path',{d:`M ${x} ${knotY} Q ${x+(960-x)*.3} ${knotY+(450-knotY)*.5} ${x<960?915:1000} 450`,fill:'none',stroke:'#91734d','stroke-width':2.1}));
 $('attached-balloons').append(svg('image',{href:`balloon-${color}.png`,x:x-size/2,y,width:size,height:size}));
}
function attachPosition(index){
 // A compact, staggered dome: later balloons fill gaps and sit in front.
 const row=Math.floor(index/8),col=index%8;
 return {x:760+col*57+(row%2)*23,y:155+row*46+Math.pow((col-3.5)/3.5,2)*67};
}
function progress(){$('progress').textContent=`${caught} из ${total}`;$('progress-bar').style.width=`${caught/total*100}%`;}
function spawn(){
 if(!queue.length)return;
 const syllable=queue.shift(),color=colors[caught%colors.length],e=document.createElement('button');
 e.className='balloon-button';e.setAttribute('aria-label','Прочитать слог '+syllable);
 e.innerHTML=`<svg viewBox="0 0 250 340" aria-hidden="true"><path d="M125 242 C98 272 153 292 125 333" fill="none" stroke="#7c684f" stroke-width="3"/></svg><img src="balloon-${color}.png" alt="" draggable="false"><span>${syllable}</span>`;
 const side=caught%2===0?-1:1;
 balloon={e,label:e.querySelector('span'),string:e.querySelector('svg'),syllable,color,side,status:'ready',born:clock,x:960+side*490,y:330+(caught%3)*43};
 e.onclick=()=>{if(mode!=='playing'||balloon?.e!==e||balloon.status!=='ready')return;balloon.status='attaching';balloon.start=clock;balloon.from={x:balloon.x,y:balloon.y};balloon.target=attachPosition(caught);e.disabled=true;};
 $('incoming').append(e);drawBalloon(balloon,1,0);
}
function drawBalloon(b,scale,angle){b.e.style.transform=`translate3d(${b.x-125}px,${b.y-125}px,0) rotate(${angle}deg) scale(${scale})`;}
function starterCount(count){return count<=4?8:count<=8?6:count<=16?4:2;}
function resetCamera(){for(const id of ['clouds','distant-clouds']){$(id).setAttribute('opacity','0');$(id).removeAttribute('transform');}$('street').style.transform='';$('street').style.opacity='1';$('street').style.setProperty('--feather','0px');$('house-shadow').removeAttribute('transform');}
function start(){
 if(!pairs().length)return;
 clean();queue=shuffle(pairs());total=queue.length;caught=0;clock=0;lastTime=0;houseY=0;pose={x:0,y:0,angle:0};mode='playing';
 $('menu').hidden=true;$('ending').hidden=true;$('playfield').hidden=false;$('back').disabled=false;
 resetCamera();lastPose='';renderHouse();$('clouds').setAttribute('opacity','0');$('clouds').removeAttribute('transform');$('house-shadow').setAttribute('opacity','.21');
 [[900,155],[1008,162],[828,225],[1084,234],[885,272],[996,269],[932,209],[945,315]].slice(0,starterCount(total)).forEach(([x,y],i)=>addAttached(x,y,colors[i%5],104));
 progress();spawn();raf=requestAnimationFrame(frame);$('back').focus({preventScroll:true});
}
function smooth(t){return t*t*(3-2*t);}
function updatePlaying(){
 const anticipation=total>1?Math.max(0,(caught/total-.65)/.35):0;
 houseY=reduced?0:-12*anticipation+Math.sin(clock*.0016)*6*anticipation;
 pose={x:reduced?0:Math.sin(clock*.0012)*4*anticipation,y:houseY,angle:0};
 const b=balloon;if(!b)return;
 if(b.status==='ready'){
  const t=(clock-b.born)/1000;
  b.x=960+b.side*490+(reduced?0:Math.sin(t*.7)*34);b.y=330+(caught%3)*43+(reduced?0:Math.sin(t*.9)*20);
  drawBalloon(b,1,reduced?0:Math.sin(t*.6)*3);
 }else{
  const t=Math.min(1,(clock-b.start)/(reduced?400:1300)),u=smooth(t);
  const end={x:b.target.x+pose.x,y:b.target.y+52+pose.y};
  b.x=b.from.x+(end.x-b.from.x)*u;
  b.y=b.from.y+(end.y-b.from.y)*u-(reduced?0:Math.sin(Math.PI*u)*80);
  drawBalloon(b,1-u*.584,reduced?0:Math.sin(Math.PI*u)*b.side*-7);
  b.label.style.opacity=String(Math.max(0,1-t*2));b.string.style.opacity=String(1-t);
  if(t===1){addAttached(b.target.x,b.target.y,b.color);b.e.remove();balloon=null;caught++;progress();if(caught===total){mode='finale';finalStart=clock;$('back').disabled=true;}else spawn();}
 }
}
function updateFinale(){
 const duration=reduced?2200:9400,t=Math.min(1,(clock-finalStart)/duration);
 // The camera follows the vertical ascent; the street moves down behind the house.
 const rise=smooth(Math.min(1,t/.66)),camera=1240*rise;
 $('street').style.transform=reduced?'':`translateY(${camera}px)`;
 $('street').style.opacity=reduced?String(1-rise):'1';
 $('street').style.setProperty('--feather',`${Math.min(170,camera*.8)}px`);
 $('house-shadow').setAttribute('transform',`translate(0 ${camera})`);
 $('house-shadow').setAttribute('opacity',String(Math.max(0,.21*(1-rise*4))));
 if(t<.66){pose={x:reduced?0:Math.sin(rise*Math.PI)*10,y:houseY+(-112-houseY)*rise,angle:reduced?0:Math.sin(rise*Math.PI)*-2};}
 else {const p=smooth((t-.66)/.34);pose={x:1850*p,y:-112-450*p,angle:reduced?0:12*Math.sin(p*Math.PI*.8)};}
 // Two cloud depths pass downward at different speeds while the camera rises.
 $('distant-clouds').setAttribute('opacity',String(.85*smooth(Math.min(1,t/.23))));
 $('distant-clouds').setAttribute('transform',`translate(${-25*rise} ${camera*.63})`);
 $('clouds').setAttribute('opacity',String(.9*smooth(Math.min(1,t/.3))));
 $('clouds').setAttribute('transform',`translate(${-65*rise} ${camera*.88})`);
 if(t===1){mode='done';$('ending').hidden=false;$('again').focus({preventScroll:true});}
}

function frame(now){
 if(mode!=='playing'&&mode!=='finale')return;
 if(document.hidden){lastTime=0;raf=requestAnimationFrame(frame);return;}
 if(lastTime)clock+=Math.min(now-lastTime,150);lastTime=now;
 if(mode==='playing')updatePlaying();else updateFinale();
 renderHouse();
 if(mode==='playing'||mode==='finale')raf=requestAnimationFrame(frame);
}
